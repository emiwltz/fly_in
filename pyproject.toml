[project]
name = "fly-in"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arcade>=3.3.3",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.18.2",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
exclude = [
    "^\\.venv/",
    "^__pycache__/",
]
